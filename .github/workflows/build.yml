name: "Gradle build"
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: "Gradle build ${{ matrix.target }}"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    strategy:
      matrix:
        target: [Debug, Release]

    steps:
      - name: "Free disk space"
        run: |
          # Deleting unneeded software packages
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go

          # Log available space
          df -h

      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Setup Java"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}

      - name: "Setup matchers"
        run: |
          # Setting up matchers...

          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done

      - name: Load shared Android signing identity
        if: github.event_name != 'pull_request'
        env:
          TEMPLATE_KS_BASE64: ${{ secrets.TEMPLATE_KS_BASE64 }}
          TEMPLATE_KS_PASS: ${{ secrets.TEMPLATE_KS_PASS }}
          TEMPLATE_KEY_ALIAS: ${{ secrets.TEMPLATE_KEY_ALIAS }}
          TEMPLATE_KEY_PASS: ${{ secrets.TEMPLATE_KEY_PASS }}
          TEMPLATE_CERT_SHA256: ${{ vars.TEMPLATE_CERT_SHA256 }}
        run: python3 tools/setup_shared_signing.py

      - name: "Execute Gradle assemble"
        run: "./gradlew ${{ github.event_name == 'pull_request' && '-Ptemplate.localTestSigning=true' || '' }} assemble${{ matrix.target }}"

      - name: "Execute Gradle lint"
        run: "./gradlew ${{ github.event_name == 'pull_request' && '-Ptemplate.localTestSigning=true' || '' }} lint${{ matrix.target }}"

      - name: Remove staged signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shared-android-signing.p12"
